services:
  localstack:
    image: localstack/localstack:4.4.0
    container_name: localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3,dynamodb,lambda,apigateway
      - AWS_DEFAULT_REGION=us-east-1
    volumes:
      - "${PWD}/setup.sh:/etc/localstack/init/ready.d/setup.sh"
      - "${PWD}/src:/tmp/src"
      - /var/run/docker.sock:/var/run/docker.sock